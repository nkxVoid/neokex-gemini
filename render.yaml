services:
  - type: web
    name: gemini-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && playwright install chromium
    startCommand: python app.py
    envVars:
      - key: PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS
        value: "true"
      - key: ACCOUNT_COOKIES
        sync: false
